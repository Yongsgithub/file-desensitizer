[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-desensitizer"
version = "0.1.0"
description = "文件信息脱敏工具 — 自动识别并遮盖图片/Word/PDF中的姓名、手机号、身份证、住址等敏感信息"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "CodeBuddy Skill"}
]
keywords = ["desensitization", "privacy", "PII", "redaction", "ocr", "MCP"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
]

dependencies = [
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "PyMuPDF>=1.23.0",
    "python-docx>=1.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]

[project.scripts]
file-desensitizer = "file_desensitizer.main:main"

[project.entry-points."mcp.servers"]
file-desensitizer-mcp = "file_desensitizer.server:mcp"

[tool.setuptools.packages.find]
where = ["src"]
